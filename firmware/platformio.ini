; PlatformIO project for the ESP32 button box phone firmware.
; Build:        pio run
; Flash app:    pio run -t upload
; Flash audio:  pio run -t uploadfs   (contents of data/, see README.md)
; Serial log:   pio device monitor

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

; Custom 4 MB layout: small app partition, large LittleFS partition, no OTA.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

; ESP32-audioI2S pinned to a release that still supports the Arduino-ESP32 2.x core
; (the core shipped by the PlatformIO espressif32 platform) and runs without PSRAM.
; See README.md, section "Audio library".
lib_deps =
    ; tag 3.0.12 = commit 928c420 (its library.json still says "2.0.0", so PlatformIO prints that)
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12

; Copies firmware/placeholders/*.wav into data/ (only missing files) before buildfs/uploadfs.
extra_scripts = pre:tools/copy_placeholders.py
