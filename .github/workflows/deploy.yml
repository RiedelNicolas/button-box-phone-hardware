name: Deploy Blueprint to GitHub Pages

on:
  push:
    branches:
      - main
      - RiedelNicolas/button-box-phone-blueprint
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Pre-flight syntax validation
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          for f in js/*.js js/models/*.js; do
            cat "$f" | node --input-type=module -c
            echo "✓ $f is valid"
          done

  # Deployment to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Publish only the files the site loads (three.js comes from esm.sh);
      # firmware/, README.md and package.json stay out of the artifact.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
